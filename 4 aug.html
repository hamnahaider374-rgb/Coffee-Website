<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
.header{
    position:relative;
}

.header img{
    width:100%;
    height:500px;
    object-fit:cover;
}
/* Navbar on top of image */
nav{
    position:absolute;
    top:20px;
    width:100%;
}

nav ul{
    list-style:none;
    display:flex;
    justify-content:center;
}

nav ul li{
    margin:0 20px;
}

nav ul li a{
    color:rgb(20, 20, 20);
    text-decoration:none;
    font-size:20px;
    font-weight:bold;
}

nav ul li a:hover{
    color:yellow;
}
</style>
<body>
<div class="header">
    <img src="https://i.pinimg.com/1200x/37/fa/db/37fadb01b6fd57208b5ad7eb13af3555.jpg" width="1200" height="600">

<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">Feedback</a></li>
        <li><a href="#">Place order</a></li>
        <li><a href="#">Reviews</a></li>
        <li><a href="#">Help center</a></li>
    </ul>
</nav>
</div>
</body>
</html>
