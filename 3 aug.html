<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="D:\WEB DEVELOPMENT\style.css">
</head>
<style>
    .box{
        width: 300px;
        height: 300px;
        border: 2px solid black;
        display: inline-block;
        background-color: darkcyan;
    }
    #red{
        background-color: cadetblue;
        border-radius: 50px;
        border-top-left-radius: 40px;
        border-bottom-left-radius: 30px;
        padding: 10px;
    }
    #black{
        background-color: rgb(180, 116, 129);
        border-radius: 30px;
        border-bottom-left-radius: 3000px;
        border-top-right-radius: 3000px;
        border-top-radius: 100px;
    }
    #orange{
        background-color: honeydew;
        border-radius: 30px;
        border-top-left-radius: 60px;
        border-top-right-radius: 600px;
        border-bottom-left-radius: 60px;
    }
    #lemon{
        background-color:khaki;
        border-radius: 30px;
    }
    .box2{
        width: 300px;
        height: 300px;
        border: 2px groove black;
        display: inline-block;
        background-color: rgb(218, 168, 243);
    }
    #one{
        background-color: rgb(211, 140, 140);
        border-radius: 30px;
        border-top-left-radius: 3000px;
        border-bottom-right-radius: 3000px;
        padding: 10px;
    }
    #two{
        background-color: azure;
        border-radius: 100%;
        width: 200px;
        height: 200px;
    }

</style>

<body>
    <div class="box" id="red"><div>
    <div class="box" id="black"></div>
    <div class="box" id="orange"></div>
    <div class="box" id="lemon"></div>
    <hr>
    <div class="box2"><img src="https://i.pinimg.com/736x/83/f6/32/83f632c19a6f430e632a116beec4b3bd.jpg" width="300" height="300"></div>
    <div class="box2" id="one"></div>
</body>
</html>
